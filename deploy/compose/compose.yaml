# ─────────────────────────────────────────────────────────────────────────────
# Euron Video System: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/demo/gen-local-env.sh). They are random, local-only throwaways.
# ─────────────────────────────────────────────────────────────────────────────
name: evs

x-common-env: &common-env
  NODE_ENV: production
  TZ: UTC
  LOG_LEVEL: ${EVS_LOG_LEVEL:-info}
  DATABASE_URL: postgres://evs:evs@postgres:5432/evs
  DATA_ENCRYPTION_KEY: ${EVS_DATA_ENCRYPTION_KEY:?run `make env` first}

# API + CLI share one environment (the CLI uses the API's services).
x-api-env: &api-env
  PUBLIC_API_BASE: ${EVS_PUBLIC_API_BASE:-http://localhost:8080}
  CORS_ALLOWED_ORIGINS: ${EVS_CORS_ALLOWED_ORIGINS:-http://localhost:${EVS_CONSOLE_PORT:-3000},http://127.0.0.1:${EVS_CONSOLE_PORT:-3000}}
  API_KEY_PEPPER: ${EVS_API_KEY_PEPPER:?run `make env` first}
  PLAYBACK_SIGNING_KEYS: ${EVS_PLAYBACK_SIGNING_KEYS:?run `make env` first}
  PLAYBACK_ACTIVE_KID: ${EVS_PLAYBACK_ACTIVE_KID:-k1}

services:
  postgres:
    image: postgres:16.12-alpine
    environment:
      POSTGRES_DB: evs
      POSTGRES_USER: evs
      POSTGRES_PASSWORD: evs
    ports:
      - "127.0.0.1:${EVS_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evs -d evs"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot: apply db/migrations, then exit 0. The same image runs the
  # `evs` CLI (`make key`), so it carries the API environment.
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: tools
    environment:
      <<: [*common-env, *api-env]
      EVS_SERVICE: cli
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: runtime
    environment:
      <<: [*common-env, *api-env]
      EVS_SERVICE: api
      PORT: "8080"
      CLUSTER_WORKERS: "2"
    ports:
      - "127.0.0.1:${EVS_API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
      args:
        WHISPER_MODEL: ${EVS_WHISPER_MODEL:-base}
        CAPTIONS: ${EVS_CAPTIONS:-true}
    environment:
      <<: *common-env
      EVS_SERVICE: worker
      WORKER_PLATFORM: local
      WORKER_MODE: all
      WORKER_DRY_RUN_SHUTDOWN: "true"
      CAPTIONS_ENABLED: ${EVS_CAPTIONS:-true}
      PG_POOL_MAX: "3"
      # Faster demo encodes; production keeps the quality-first default (medium).
      LADDER_PRESET: ${EVS_LADDER_PRESET:-veryfast}
    tmpfs:
      - /work:size=8g,uid=1000,gid=1000
    deploy:
      replicas: ${EVS_WORKER_REPLICAS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Local autoscaler: reaps stale claims and LOGS the scaling decision it
  # would take (LAUNCHER=noop). On AWS the same code launches EC2 Spot.
  orchestrator:
    build:
      context: ../..
      dockerfile: infra/docker/orchestrator.Dockerfile
    environment:
      NODE_ENV: production
      TZ: UTC
      EVS_SERVICE: orchestrator
      DATABASE_URL: postgres://evs:evs@postgres:5432/evs
      LAUNCHER: noop
      ORCHESTRATOR_INTERVAL_MS: "30000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  console:
    build:
      context: ../..
      dockerfile: infra/docker/console.Dockerfile
      args:
        VITE_API_BASE: ${EVS_PUBLIC_API_BASE:-http://localhost:8080}
    ports:
      - "127.0.0.1:${EVS_CONSOLE_PORT:-3000}:8080"
    restart: unless-stopped

volumes:
  pgdata:
