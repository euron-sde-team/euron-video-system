<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="t d">
  <title id="t">Euron Video System architecture</title>
  <desc id="d">Clients call the control plane API; the API uses Postgres, KMS and Secrets Manager; an orchestrator launches Spot workers that transcode from the uploads bucket into encrypted HLS in the media bucket, served to viewers through CloudFront signed URLs.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b8cff"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f5a524"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b95a8"/>
    </marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
    <style>
      .t  { font: 600 15px Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #eef1f7; }
      .s  { font: 400 12.5px Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b95a8; }
      .g  { font: 600 11px Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7487; letter-spacing: 1.4px; }
      .m  { font: 400 11.5px "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace; fill: #9aa3b5; }
      .ml { font: 400 11px "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace; fill: #7d879b; }
      .card { fill: #131822; stroke: #263042; stroke-width: 1.2; }
      .hl   { fill: #141c2e; stroke: #3b5bdb; stroke-width: 1.4; }
      .grp  { fill: none; stroke: #222a38; stroke-width: 1; stroke-dasharray: 4 5; }
      .ln   { fill: none; stroke: #5b8cff; stroke-width: 1.6; }
      .lg   { fill: none; stroke: #34d399; stroke-width: 1.6; }
      .la   { fill: none; stroke: #f5a524; stroke-width: 1.6; }
      .lm   { fill: none; stroke: #8b95a8; stroke-width: 1.4; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="1400" height="840" rx="18" fill="#0b0d12"/>
  <rect width="1400" height="840" rx="18" fill="url(#grid)"/>

  <!-- ── Group frames ─────────────────────────────────────────────────── -->
  <rect class="grp" x="24"   y="112" width="300" height="400" rx="14"/>
  <text class="g"   x="44"   y="134">CLIENTS</text>
  <rect class="grp" x="360"  y="112" width="420" height="400" rx="14"/>
  <text class="g"   x="380"  y="134">CONTROL PLANE · ECS FARGATE</text>
  <rect class="grp" x="820"  y="112" width="300" height="340" rx="14"/>
  <text class="g"   x="840"  y="134">STATE &amp; KEYS</text>
  <rect class="grp" x="1150" y="112" width="226" height="320" rx="14"/>
  <text class="g"   x="1168" y="134">DELIVERY</text>
  <rect class="grp" x="360"  y="572" width="760" height="190" rx="14"/>
  <text class="g"   x="380"  y="594">TRANSCODE FLEET</text>
  <text class="g"   x="900"  y="594" text-anchor="end">SCALES FROM ZERO</text>

  <!-- ── Clients ──────────────────────────────────────────────────────── -->
  <rect class="card" x="44" y="150" width="260" height="78" rx="10"/>
  <text class="t" x="62" y="180">Viewer's player</text>
  <text class="s" x="62" y="202">web · iOS · Android · TV</text>
  <text class="ml" x="62" y="219">playback token</text>

  <rect class="card" x="44" y="262" width="260" height="78" rx="10"/>
  <text class="t" x="62" y="292">Operator console</text>
  <text class="s" x="62" y="314">upload · monitor · govern</text>
  <text class="ml" x="62" y="331">scoped API key</text>

  <rect class="card" x="44" y="374" width="260" height="110" rx="10"/>
  <text class="t" x="62" y="404">Your platform backend</text>
  <text class="s" x="62" y="426">decides who may watch,</text>
  <text class="s" x="62" y="444">mints playback sessions</text>
  <text class="ml" x="62" y="469">scoped API key · webhooks</text>

  <!-- ── Control plane ────────────────────────────────────────────────── -->
  <rect class="hl" x="380" y="150" width="380" height="250" rx="10"/>
  <text class="t" x="400" y="180">API</text>
  <text class="s" x="436" y="180">Express 5 · cluster · OpenAPI 3.1</text>
  <g class="m">
    <text x="400" y="214">/v1/videos</text>            <text x="590" y="214">upload · lifecycle</text>
    <text x="400" y="238">/v1/playback-sessions</text> <text x="590" y="238">tokens · revocation</text>
    <text x="400" y="262">/v1/play/:id/*</text>        <text x="590" y="262">playlists · AES key</text>
    <text x="400" y="286">/v1/playback-policies</text> <text x="590" y="286">TTL · origins · caps</text>
    <text x="400" y="310">/v1/api-keys</text>          <text x="590" y="310">scoped, hashed</text>
    <text x="400" y="334">/v1/webhooks</text>          <text x="590" y="334">signed outbox</text>
    <text x="400" y="358">/v1/audit-events</text>      <text x="590" y="358">append-only</text>
    <text x="400" y="382">/v1/usage · /metrics</text>  <text x="590" y="382">rollups · Prometheus</text>
  </g>

  <rect class="card" x="380" y="430" width="380" height="64" rx="10"/>
  <text class="t" x="400" y="458">Webhook dispatcher</text>
  <text class="s" x="400" y="479">claims due outbox rows · HMAC-signs · backoff</text>

  <!-- ── State & keys ─────────────────────────────────────────────────── -->
  <rect class="card" x="840" y="150" width="260" height="70" rx="10"/>
  <text class="t" x="858" y="179">KMS customer key</text>
  <text class="s" x="858" y="201">wraps per-video AES-128 keys</text>

  <rect class="card" x="840" y="244" width="260" height="70" rx="10"/>
  <text class="t" x="858" y="273">Secrets Manager</text>
  <text class="s" x="858" y="295">DB password, read per connection</text>

  <rect class="hl" x="840" y="338" width="260" height="96" rx="10"/>
  <text class="t" x="858" y="367">Postgres 16</text>
  <text class="s" x="858" y="389">state + work queue</text>
  <text class="ml" x="858" y="411">FOR UPDATE SKIP LOCKED</text>

  <!-- ── Delivery ─────────────────────────────────────────────────────── -->
  <rect class="card" x="1168" y="150" width="190" height="62" rx="10"/>
  <text class="t" x="1186" y="178">CloudFront</text>
  <text class="s" x="1186" y="198">OAC · signed URLs</text>

  <rect class="card" x="1168" y="252" width="190" height="70" rx="10"/>
  <text class="t" x="1186" y="280">S3 · media</text>
  <text class="s" x="1186" y="301">encrypted HLS, posters</text>

  <rect class="card" x="1168" y="348" width="190" height="66" rx="10"/>
  <text class="t" x="1186" y="376">S3 · downloads</text>
  <text class="s" x="1186" y="396">MP4, presigned GET</text>

  <rect class="card" x="1168" y="640" width="190" height="70" rx="10"/>
  <text class="t" x="1186" y="668">S3 · uploads</text>
  <text class="s" x="1186" y="689">raw sources, expiring</text>

  <!-- ── Compute ──────────────────────────────────────────────────────── -->
  <rect class="card" x="380" y="616" width="250" height="118" rx="10"/>
  <text class="t" x="398" y="645">Orchestrator</text>
  <text class="s" x="398" y="667">Lambda · every minute</text>
  <text class="ml" x="398" y="692">reap → count → launch</text>
  <text class="ml" x="398" y="712">never terminates</text>

  <rect class="hl" x="714" y="616" width="390" height="118" rx="10"/>
  <text class="t" x="732" y="645">Workers · EC2 Spot</text>
  <text class="s" x="732" y="667">FFmpeg ladder · AES-128 HLS · sprites</text>
  <text class="s" x="732" y="687">whisper.cpp captions · MP4 · KMS wrap</text>
  <text class="ml" x="732" y="712">claim · heartbeat · self-terminate when idle</text>

  <!-- ── Connectors ───────────────────────────────────────────────────── -->
  <!-- viewer → API: playlists + key -->
  <path class="ln" d="M304 189 H378" marker-end="url(#a)"/>
  <text class="ml" x="310" y="181">token</text>
  <!-- console → API -->
  <path class="ln" d="M304 301 H378" marker-end="url(#a)"/>
  <!-- platform → API -->
  <path class="ln" d="M304 392 H378" marker-end="url(#a)"/>
  <text class="ml" x="310" y="384">REST</text>
  <!-- dispatcher → platform -->
  <path class="la" d="M380 462 H306" marker-end="url(#aa)"/>
  <text class="ml" x="312" y="455" style="fill:#f5a524">events</text>

  <!-- viewer → CloudFront (segments), routed over the top -->
  <path class="ln" d="M174 150 V88 H1263 V148" marker-end="url(#a)"/>
  <text class="ml" x="640" y="80">segments · CloudFront signed URLs scoped to one video and the token's lifetime</text>
  <!-- CloudFront → media -->
  <path class="ln" d="M1263 212 V250" marker-end="url(#a)"/>
  <text class="ml" x="1270" y="236">OAC</text>

  <!-- API → KMS (unwrap) -->
  <path class="lg" d="M760 185 H838" marker-end="url(#ag)"/>
  <text class="ml" x="767" y="177" style="fill:#34d399">unwrap</text>
  <!-- API ↔ Postgres -->
  <path class="ln" d="M760 380 H838" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- API → Secrets -->
  <path class="lg" d="M760 279 H838" marker-end="url(#ag)"/>

  <!-- orchestrator → Postgres (queue depth) -->
  <path class="la" d="M505 616 V540 H900 V436" marker-end="url(#aa)"/>
  <text class="ml" x="560" y="533" style="fill:#f5a524">queue depth · reap</text>
  <!-- workers ↔ Postgres (claim / heartbeat) -->
  <path class="la" d="M1010 616 V436" marker-start="url(#aa)" marker-end="url(#aa)"/>
  <text class="ml" x="1018" y="560" style="fill:#f5a524">claim · heartbeat</text>
  <!-- orchestrator → workers -->
  <path class="la" d="M630 675 H712" marker-end="url(#aa)"/>
  <text class="ml" x="636" y="667" style="fill:#f5a524">EC2 Fleet</text>

  <!-- workers → uploads (read source) -->
  <path class="ln" d="M1166 675 H1106" marker-end="url(#a)"/>
  <!-- workers → media + downloads -->
  <path class="ln" d="M1104 640 H1136 V287 H1166" marker-end="url(#a)"/>
  <path class="ln" d="M1136 381 H1166" marker-end="url(#a)"/>
  <text class="ml" x="1110" y="470" transform="rotate(-90 1128 470)">encrypted HLS · MP4</text>

  <!-- platform → uploads (presigned POST, direct) -->
  <path class="lm" d="M174 484 V790 H1263 V712" marker-end="url(#am)"/>
  <text class="ml" x="560" y="782">browser uploads straight to S3 with a presigned POST · the API never proxies bytes</text>

  <!-- ── Legend ───────────────────────────────────────────────────────── -->
  <g transform="translate(24 30)">
    <text class="t" x="0" y="20" style="font-size:20px">System architecture</text>
    <g transform="translate(860 6)">
      <line x1="0" y1="8" x2="26" y2="8" class="ln"/><text class="ml" x="32" y="12">requests · media</text>
      <line x1="150" y1="8" x2="176" y2="8" class="lg"/><text class="ml" x="182" y="12">keys · secrets</text>
      <line x1="290" y1="8" x2="316" y2="8" class="la"/><text class="ml" x="322" y="12">queue · events</text>
    </g>
  </g>
</svg>
