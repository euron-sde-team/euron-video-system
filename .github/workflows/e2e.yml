name: e2e

# Full stack on the Floci AWS emulator: Terraform provisions it, a real video
# goes through upload -> transcode -> encrypted playback, and access control
# is asserted from the outside.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-floci:
    name: end-to-end on Floci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and jq
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq
      - uses: docker/setup-buildx-action@v3
      - name: Run e2e
        env:
          EVS_CAPTIONS: "false" # slim worker image keeps CI fast
        run: make e2e
